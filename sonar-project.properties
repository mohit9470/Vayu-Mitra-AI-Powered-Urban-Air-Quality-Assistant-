# SonarQube Project Configuration for VayuMitra / VayuGuard
sonar.projectKey=vayumitra-air-quality-assistant
sonar.projectName=VayuMitra
sonar.projectVersion=1.0.0

# Source & Test Code
sonar.sources=src
sonar.tests=src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Inclusions & Exclusions
sonar.exclusions=node_modules/**,.next/**,coverage/**,public/**
sonar.sourceEncoding=UTF-8

# Coverage & Quality Gates
sonar.javascript.lcov.reportPaths=coverage/lcov.info
